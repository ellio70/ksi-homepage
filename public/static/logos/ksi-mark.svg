<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KSI mark">
  <defs>
    <linearGradient id="ksi-mk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#040814"/>
  <!-- Rounded "KSI" inside -->
  <text x="32" y="42" text-anchor="middle"
        font-family="'Space Grotesk','Inter',sans-serif"
        font-size="26" font-weight="800" letter-spacing="-1" fill="url(#ksi-mk)">KSI</text>
  <!-- bottom accent line -->
  <rect x="14" y="50" width="36" height="2.5" rx="1.25" fill="url(#ksi-mk)" opacity="0.85"/>
</svg>
