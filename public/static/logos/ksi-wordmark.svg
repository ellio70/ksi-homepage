<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="KS INDUSTRY">
  <defs>
    <linearGradient id="ksi-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Mark: KSI letters with cyan-blue underline accent -->
  <g transform="translate(0,8)">
    <text x="0" y="48" font-family="'Space Grotesk','Inter',sans-serif"
          font-size="56" font-weight="800" letter-spacing="-2" fill="#ffffff">KSI</text>
    <rect x="2" y="60" width="118" height="4" rx="2" fill="url(#ksi-bar)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(140,8)">
    <text x="0" y="32" font-family="'Inter','Noto Sans KR',sans-serif"
          font-size="16" font-weight="700" letter-spacing="3" fill="#ffffff">KS INDUSTRY</text>
    <text x="0" y="56" font-family="'Inter','Noto Sans KR',sans-serif"
          font-size="11" font-weight="500" letter-spacing="2.5" fill="#94a3b8">
      MARINE CRANE · SINCE 1990s
    </text>
  </g>
</svg>
