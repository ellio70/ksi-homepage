<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Marine Robotics Lab">
  <defs>
    <linearGradient id="mrl-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Main wordmark — text only as requested -->
  <text x="0" y="38" font-family="'Space Grotesk','Inter',sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.5" fill="#ffffff">
    Marine<tspan font-weight="300" fill="url(#mrl-accent)"> Robotics </tspan>Lab
  </text>

  <!-- Korean subline -->
  <text x="0" y="66" font-family="'Noto Sans KR','Inter',sans-serif"
        font-size="13" font-weight="500" letter-spacing="6" fill="#cbd5e1" opacity="0.8">
    마린로보틱스연구소
  </text>
